name: Refresh saree catalog

on:
  schedule:
    - cron: "30 2 * * *"      # daily, 02:30 UTC (08:30 Dhaka)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["sources.json", "scripts/**"]

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Fetch catalog
        run: python scripts/fetch_catalog.py

      - name: Commit if changed
        run: |
          git config user.name "catalog-bot"
          git config user.email "catalog-bot@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "catalog: refresh $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi
