<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saree Gallery</title>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#2f3b5c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
  :root {
    --paper: #f6f5f1;
    --ink: #1c1a17;
    --ink-2: #5d5851;
    --ink-3: #9a948b;
    --line: #dedbd3;
    --indigo: #2f3b5c;
    --indigo-soft: #e3e6ee;
    --sheet: #fbfaf7;
    --radius: 2px;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #16150f;
      --ink: #ece8df;
      --ink-2: #b2ac9f;
      --ink-3: #746f66;
      --line: #2c2a24;
      --indigo: #a9b6dc;
      --indigo-soft: #232838;
      --sheet: #1d1c16;
    }
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Newsreader", Georgia, "Times New Roman", serif;
    font-size: 17px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--indigo); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

  /* ---------- header ---------- */
  header {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
    background: color-mix(in srgb, var(--paper) 92%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .bar {
    display: flex; align-items: baseline; gap: 18px;
    padding: 14px 20px 8px;
    max-width: 1400px; margin: 0 auto;
  }
  .bar h1 {
    margin: 0; font-weight: 400; font-size: 26px; letter-spacing: -0.01em; white-space: nowrap;
  }
  .bar h1 em { font-style: italic; color: var(--indigo); }
  .bar .count { color: var(--ink-3); font-size: 15px; white-space: nowrap; }
  .bar .spacer { flex: 1; }
  .search {
    border: 0; border-bottom: 1px solid var(--line); background: none;
    font: inherit; font-size: 16px; color: var(--ink); padding: 4px 0; width: clamp(90px, 22vw, 200px); min-width: 0;
  }
  .search { min-width: 84px; }
  @media (max-width: 480px) { .bar { gap: 12px; } .bar .count { display: none; } }
  .search::placeholder { color: var(--ink-3); font-style: italic; }
  .search:focus { outline: none; border-bottom-color: var(--indigo); }
  .savedbtn { color: var(--ink-2); font-size: 15px; white-space: nowrap; }
  .savedbtn[aria-pressed="true"] { color: var(--indigo); }

  .strip {
    display: flex; gap: 22px; overflow-x: auto; scrollbar-width: none;
    padding: 4px 20px 12px; max-width: 1400px; margin: 0 auto;
  }
  .strip::-webkit-scrollbar { display: none; }
  .chip {
    white-space: nowrap; color: var(--ink-2); font-size: 16px;
    border-bottom: 1px solid transparent; padding-bottom: 1px;
  }
  .chip[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--indigo); }
  .chip small { color: var(--ink-3); font-size: 13px; margin-left: 4px; }
  .strip.fabrics .chip { font-size: 15px; }

  /* ---------- gallery ---------- */
  main { max-width: 1400px; margin: 0 auto; padding: 18px 20px 80px; }
  .gallery { columns: 2; column-gap: 14px; }
  @media (min-width: 640px)  { .gallery { columns: 3; column-gap: 18px; } }
  @media (min-width: 960px)  { .gallery { columns: 4; column-gap: 22px; } }
  @media (min-width: 1300px) { .gallery { columns: 5; } }
  .tile {
    break-inside: avoid; margin: 0 0 22px; display: block; width: 100%; text-align: left;
  }
  .tile img {
    width: 100%; height: auto; display: block; background: var(--indigo-soft);
    border-radius: var(--radius); aspect-ratio: 4 / 5; object-fit: cover;
  }
  .tile .meta { padding: 8px 2px 0; }
  .tile .brand { color: var(--ink-3); font-size: 14px; font-style: italic; }
  .tile .title { font-size: 16px; line-height: 1.3; margin: 1px 0 2px; }
  .tile .price { color: var(--ink-2); font-size: 15px; }
  .tile.sold .price::after { content: " · sold out"; color: var(--ink-3); }
  .tile .saved-mark { color: var(--indigo); margin-left: 6px; }

  .empty { color: var(--ink-2); max-width: 46ch; padding: 60px 0; font-size: 18px; }
  .empty code { font-family: ui-monospace, monospace; font-size: 14px; background: var(--indigo-soft); padding: 1px 5px; }

  /* ---------- detail sheet ---------- */
  .scrim {
    position: fixed; inset: 0; background: rgba(20,18,14,.45); z-index: 10; display: none;
  }
  .scrim.open { display: block; }
  .sheet {
    position: fixed; z-index: 11; background: var(--sheet); overflow-y: auto;
    left: 0; right: 0; bottom: 0; max-height: 92vh; border-radius: 14px 14px 0 0;
    transform: translateY(100%); transition: transform .28s ease-out;
    padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  }
  .sheet.open { transform: translateY(0); }
  @media (min-width: 900px) {
    .sheet {
      top: 0; bottom: 0; left: auto; width: min(560px, 48vw); max-height: none;
      border-radius: 0; transform: translateX(100%);
    }
    .sheet.open { transform: translateX(0); }
    .imgs { padding-top: 54px; }
  }
  .sheet .close {
    position: sticky; top: 0; float: right; margin: 10px 14px 0 0; z-index: 2;
    width: 34px; height: 34px; border-radius: 50%; background: var(--paper);
    display: grid; place-items: center; font-size: 20px; line-height: 1;
  }
  .imgs { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 6px; scrollbar-width: none; }
  .imgs::-webkit-scrollbar { display: none; }
  .imgs img {
    scroll-snap-align: start; flex: 0 0 82%; max-width: 82%; aspect-ratio: 4/5; object-fit: cover;
    background: var(--indigo-soft); display: block;
  }
  .imgs img:first-child { margin-left: 20px; }
  .imgs img:last-child { margin-right: 20px; }
  .detail { padding: 18px 22px 0; }
  .detail .brand { color: var(--indigo); font-style: italic; font-size: 16px; }
  .detail h2 { font-weight: 400; font-size: 26px; line-height: 1.2; margin: 2px 0 8px; letter-spacing: -0.01em; }
  .detail .price { font-size: 19px; color: var(--ink-2); }
  .detail .fabric { margin: 12px 0 0; color: var(--ink-2); font-size: 15px; }
  .detail .fabric span { display: inline-block; margin-right: 10px; border-bottom: 1px dotted var(--ink-3); }
  .detail p.desc { white-space: pre-line; color: var(--ink-2); font-size: 16px; margin: 16px 0 0; max-width: 62ch; }
  .actions { display: flex; gap: 14px; margin-top: 22px; flex-wrap: wrap; }
  .btn {
    padding: 10px 18px; border: 1px solid var(--ink); border-radius: 999px; font-size: 16px;
    text-decoration: none; display: inline-block;
  }
  .btn.primary { background: var(--indigo); border-color: var(--indigo); color: #fff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: var(--paper); } }
  .btn[aria-pressed="true"] { background: var(--indigo-soft); border-color: var(--indigo); }
  .similar { padding: 26px 22px 0; }
  .similar h3 { font-weight: 400; font-size: 17px; color: var(--ink-2); margin: 0 0 10px; }
  .similar .row { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; }
  .similar .row::-webkit-scrollbar { display: none; }
  .similar button { flex: 0 0 34%; text-align: left; }
  .similar img { width: 100%; aspect-ratio: 4/5; object-fit: cover; display: block; background: var(--indigo-soft); border-radius: var(--radius); }
  .similar .t { font-size: 13px; color: var(--ink-2); line-height: 1.25; margin-top: 4px; }

  /* ---------- feed: one saree per screen, photos swipe sideways ---------- */
  .modebtn { color: var(--ink-2); font-size: 15px; white-space: nowrap; }
  body.feed-mode {
    height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
    display: flex; flex-direction: column; overflow: hidden;
  }
  body.feed-mode header { position: static; }
  body.feed-mode main, body.feed-mode footer { display: none; }
  #feed { display: none; }
  body.feed-mode #feed {
    display: block; flex: 1; min-height: 0; overflow-y: auto; scroll-snap-type: y mandatory;
    overscroll-behavior: contain; scrollbar-width: none; background: #0f0e0b;
  }
  #feed::-webkit-scrollbar { display: none; }
  .slide { height: 100%; scroll-snap-align: start; scroll-snap-stop: always; position: relative; overflow: hidden; color: #fbfaf7; }
  .strip-x {
    height: 100%; display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none;
    overscroll-behavior-x: contain;
  }
  .strip-x::-webkit-scrollbar { display: none; }
  .strip-x img { flex: 0 0 100%; width: 100%; height: 100%; object-fit: contain; scroll-snap-align: start; display: block; background: #0f0e0b; }
  .strip-x img.fill { object-fit: cover; }
  /* the whole photo sits at the top; on tall screens the spare height goes below it, under the text */
  .strip-x img:not(.fill) { object-position: center top; }
  /* phone on its side: keep the filter rows out of the way so the photo gets the height */
  @media (max-height: 520px) { body.feed-mode .strip { display: none; } body.feed-mode .bar { padding-block: 8px; } }
  .slide .pos {
    position: absolute; top: 12px; right: 12px; font-size: 13px; font-variant-numeric: tabular-nums;
    background: rgba(15,14,11,.5); padding: 2px 9px; border-radius: 999px; pointer-events: none;
  }
  .slide .dots { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); display: flex; gap: 5px; pointer-events: none; }
  .slide .dots i { width: 6px; height: 6px; border-radius: 50%; background: rgba(251,250,247,.45); }
  .slide .dots i.on { background: #fbfaf7; }
  .slide .shade { position: absolute; inset: auto 0 0 0; height: 50%; pointer-events: none;
                  background: linear-gradient(to top, rgba(15,14,11,.85), rgba(15,14,11,0)); }
  .slide .meta { position: absolute; left: 16px; right: 80px; bottom: 20px; display: grid; gap: 3px; }
  .slide .meta .b { font-style: italic; color: #c9d2ec; font-size: 15px; }
  .slide .meta .t { font-size: 22px; line-height: 1.2; text-align: left; text-wrap: balance; }
  .slide .meta .p { color: rgba(251,250,247,.82); font-size: 15px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
  .slide .meta .p span.f { border-bottom: 1px dotted rgba(251,250,247,.5); }
  .slide .meta .d { font-size: 15px; color: rgba(251,250,247,.85); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .slide .meta a { font-size: 15px; text-underline-offset: 3px; width: fit-content; }
  .rail { position: absolute; right: 10px; bottom: 22px; display: grid; gap: 16px; justify-items: center; font-size: 12px; }
  .rail button { display: grid; justify-items: center; gap: 2px; color: #fbfaf7; }
  .rail .ico { width: 48px; height: 48px; border-radius: 50%; background: rgba(15,14,11,.45); display: grid; place-items: center; font-size: 22px; }
  .rail button[aria-pressed="true"] .ico { background: #2f3b5c; }
  .burst { position: absolute; left: 50%; top: 42%; font-size: 96px; transform: translate(-50%,-50%) scale(.4); opacity: 0; pointer-events: none; }
  .burst.go { animation: burst .7s ease-out; }
  @keyframes burst { 30% { opacity: .95; transform: translate(-50%,-50%) scale(1.05); } 100% { opacity: 0; transform: translate(-50%,-50%) scale(1.2); } }
  .feed-end { height: 100%; scroll-snap-align: start; display: grid; place-content: center; gap: 14px; text-align: center; color: #d8d3c8; padding: 0 24px; }
  .feed-end button { color: #fbfaf7; border: 1px solid #fbfaf7; border-radius: 999px; padding: 8px 18px; }

  footer { color: var(--ink-3); font-size: 14px; text-align: center; padding: 30px 20px; }
</style>
</head>
<body>

<header>
  <div class="bar">
    <h1>Saree <em>Gallery</em></h1>
    <span class="count" id="count"></span>
    <span class="spacer"></span>
    <input class="search" id="q" type="search" placeholder="search…" aria-label="Search sarees">
    <button class="savedbtn" id="savedToggle" aria-pressed="false">Saved</button>
    <button class="modebtn" id="modeToggle">Grid</button>
  </div>
  <nav class="strip" id="brands" aria-label="Brands"></nav>
  <nav class="strip fabrics" id="fabrics" aria-label="Fabrics"></nav>
</header>

<main>
  <div class="gallery" id="gallery"></div>
  <div class="empty" id="empty" hidden></div>
  <div id="sentinel" aria-hidden="true" style="height:1px"></div>
</main>

<div id="feed" aria-label="Saree feed"></div>
<footer id="foot"></footer>

<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" aria-hidden="true" role="dialog" aria-label="Saree details">
  <button class="close" id="close" aria-label="Close">×</button>
  <div id="sheetBody"></div>
</aside>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const state = { items: [], brands: [], brand: 'all', fabric: 'all', q: '', savedOnly: false,
                  saved: new Set(), open: null, details: null, hidden: new Set(), mode: 'feed' };
  try { state.saved = new Set(JSON.parse(localStorage.getItem('saree.saved') || '[]')); } catch {}
  try { state.hidden = new Set(JSON.parse(localStorage.getItem('saree.hidden') || '[]')); } catch {}
  try { state.mode = localStorage.getItem('saree.mode') === 'grid' ? 'grid' : 'feed'; } catch {}
  const persist = () => { try {
    localStorage.setItem('saree.saved', JSON.stringify([...state.saved]));
    localStorage.setItem('saree.hidden', JSON.stringify([...state.hidden]));
  } catch {} };
  const brandName = k => (state.brands.find(b => b.key === k) || {}).name || k;
  const fmtPrice = it => it.price == null ? '' :
    new Intl.NumberFormat('en-IN', { style: 'currency', currency: it.currency || 'INR', maximumFractionDigits: 0 }).format(it.price);
  // Shopify's CDN resizes on request; ask for roughly what the screen needs instead of the original upload.
  const sized = (url, w) => /\/\/cdn\.shopify\.com\//.test(url) ? url + (url.includes('?') ? '&' : '?') + 'width=' + w : url;
  const srcset = url => /\/\/cdn\.shopify\.com\//.test(url) ? [360, 540, 720].map(w => `${sized(url, w)} ${w}w`).join(', ') : '';
  const detail = it => (state.details && state.details[it.id]) || null;
  const searchText = it => (it.title + ' ' + brandName(it.brand) + ' ' + it.fabric.join(' ') + ' ' +
    ((detail(it) || {}).tags || []).join(' ')).toLowerCase();
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const shuffleSeeded = (arr) => { // stable daily shuffle so the wall feels curated, not sorted by brand
    const d = new Date(); let seed = d.getFullYear() * 400 + d.getMonth() * 32 + d.getDate();
    const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
    const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  };

  function filtered() {
    const q = state.q.trim().toLowerCase();
    return state.items.filter(it =>
      (state.brand === 'all' || it.brand === state.brand) &&
      (state.fabric === 'all' || it.fabric.includes(state.fabric)) &&
      (!state.savedOnly || state.saved.has(it.id)) &&
      (!q || (it._s || (it._s = searchText(it))).includes(q))
    );
  }

  function renderStrips() {
    const counts = {};
    state.items.forEach(it => counts[it.brand] = (counts[it.brand] || 0) + 1);
    const active = state.brands.filter(b => counts[b.key]);
    $('#brands').innerHTML =
      `<button class="chip" data-b="all" aria-pressed="${state.brand==='all'}">All<small>${state.items.length}</small></button>` +
      active.map(b => `<button class="chip" data-b="${b.key}" aria-pressed="${state.brand===b.key}">${esc(b.name)}<small>${counts[b.key]}</small></button>`).join('');
    const fc = {};
    state.items.forEach(it => it.fabric.forEach(f => fc[f] = (fc[f] || 0) + 1));
    const top = Object.entries(fc).sort((a, b) => b[1] - a[1]).slice(0, 14);
    $('#fabrics').innerHTML = top.length ?
      `<button class="chip" data-f="all" aria-pressed="${state.fabric==='all'}">any fabric</button>` +
      top.map(([f, n]) => `<button class="chip" data-f="${f}" aria-pressed="${state.fabric===f}">${f}<small>${n}</small></button>`).join('') : '';
  }

  function renderGallery() {
    const list = filtered();
    $('#count').textContent = list.length ? `${list.length} sarees` : '';
    const g = $('#gallery'), e = $('#empty');
    if (!state.items.length) {
      g.innerHTML = ''; e.hidden = false;
      e.innerHTML = `The catalog is empty. Run the <code>Refresh saree catalog</code> workflow in GitHub Actions, or <code>python scripts/fetch_catalog.py</code> locally, to fill it.`;
      return;
    }
    if (!list.length) {
      g.innerHTML = ''; e.hidden = false;
      e.textContent = state.savedOnly ? 'Nothing saved yet. Open a saree and tap Save.' : 'Nothing matches those filters.';
      return;
    }
    e.hidden = true;
    state.list = list; state.shown = 0;
    g.innerHTML = '';
    appendBatch();
  }

  const BATCH = 60;
  const tileHTML = it => `
      <button class="tile${it.available ? '' : ' sold'}" data-id="${it.id}">
        <img src="${esc(it.thumb || sized(it.img, 540))}" srcset="${esc(it.thumb ? '' : srcset(it.img))}"
             sizes="(min-width: 1300px) 20vw, (min-width: 960px) 25vw, (min-width: 640px) 33vw, 50vw" alt="" loading="lazy" decoding="async">
        <div class="meta">
          <div class="brand">${esc(brandName(it.brand))}</div>
          <div class="title">${esc(it.title)}${state.saved.has(it.id) ? '<span class="saved-mark">●</span>' : ''}</div>
          <div class="price">${fmtPrice(it)}</div>
        </div>
      </button>`;
  function appendBatch() {
    if (!state.list || state.shown >= state.list.length) return;
    const next = state.list.slice(state.shown, state.shown + BATCH);
    $('#gallery').insertAdjacentHTML('beforeend', next.map(tileHTML).join(''));
    state.shown += next.length;
  }

  function similarTo(it, n = 8) {
    const score = o => {
      if (o.id === it.id) return -1;
      let s = 0;
      o.fabric.forEach(f => { if (it.fabric.includes(f)) s += 3; });
      if (o.brand !== it.brand) s += 1; // cross-brand is the point
      const bo = state.brands.find(b => b.key === o.brand) || {}, bi = state.brands.find(b => b.key === it.brand) || {};
      if (bo.register && bo.register === bi.register) s += 1;
      if (it.price && o.price) s += Math.max(0, 2 - Math.abs(Math.log(o.price / it.price)));
      return s;
    };
    return state.items.map(o => [score(o), o]).filter(x => x[0] > 0).sort((a, b) => b[0] - a[0]).slice(0, n).map(x => x[1]);
  }

  function openItem(id) {
    const it = state.items.find(x => x.id === id); if (!it) return;
    state.open = id;
    const d = detail(it) || { images: [it.img], description: '' };
    const saved = state.saved.has(id);
    $('#sheetBody').innerHTML = `
      <div class="imgs">${d.images.map(s => `<img src="${esc(sized(s, 1080))}" alt="" loading="lazy">`).join('')}</div>
      <div class="detail">
        <div class="brand">${esc(brandName(it.brand))}</div>
        <h2>${esc(it.title)}</h2>
        <div class="price">${fmtPrice(it)}${it.available ? '' : ' <span style="color:var(--ink-3)">· sold out</span>'}</div>
        ${it.fabric.length ? `<div class="fabric">${it.fabric.map(f => `<span>${f}</span>`).join('')}</div>` : ''}
        ${d.description ? `<p class="desc">${esc(d.description)}</p>` : ''}
        <div class="actions">
          <a class="btn primary" href="${esc(it.url)}" target="_blank" rel="noopener">Open on ${esc(brandName(it.brand))}</a>
          <button class="btn" id="saveBtn" aria-pressed="${saved}">${saved ? 'Saved' : 'Save'}</button>
        </div>
      </div>
      <div class="similar"><h3>Similar drapes</h3><div class="row">${similarTo(it).map(o => `
        <button data-id="${o.id}"><img src="${esc(o.thumb || sized(o.img, 360))}" alt="" loading="lazy"><div class="t">${esc(brandName(o.brand))} — ${esc(o.title)}</div></button>`).join('')}</div></div>`;
    $('#sheet').scrollTop = 0;
    $('#sheet').classList.add('open'); $('#sheet').setAttribute('aria-hidden', 'false');
    $('#scrim').classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeSheet() {
    state.open = null;
    $('#sheet').classList.remove('open'); $('#sheet').setAttribute('aria-hidden', 'true');
    $('#scrim').classList.remove('open');
    document.body.style.overflow = '';
  }

  // ---- events
  document.addEventListener('click', e => {
    const chipB = e.target.closest('[data-b]'); if (chipB) { state.brand = chipB.dataset.b; renderStrips(); render(); return; }
    const chipF = e.target.closest('[data-f]'); if (chipF) { state.fabric = chipF.dataset.f; renderStrips(); render(); return; }
    const tile = e.target.closest('[data-id]'); if (tile) { openItem(tile.dataset.id); return; }
    if (e.target.id === 'saveBtn') {
      state.saved.has(state.open) ? state.saved.delete(state.open) : state.saved.add(state.open);
      persist(); openItem(state.open);
      const t = document.querySelector(`.tile[data-id="${CSS.escape(state.open)}"] .title`);
      if (t) { const m = t.querySelector('.saved-mark'); if (state.saved.has(state.open)) { if (!m) t.insertAdjacentHTML('beforeend', '<span class="saved-mark">●</span>'); } else if (m) m.remove(); }
      syncFeedSave(state.open);
      if (state.savedOnly) render();
      return;
    }
    if (e.target.id === 'close' || e.target.id === 'scrim') closeSheet();
  });
  $('#q').addEventListener('input', e => { state.q = e.target.value; render(); });
  $('#savedToggle').addEventListener('click', e => {
    state.savedOnly = !state.savedOnly; e.target.setAttribute('aria-pressed', state.savedOnly); render();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && state.open) closeSheet(); });

  // ---- feed ----------------------------------------------------------------------------------
  const render = () => state.mode === 'feed' ? renderFeed() : renderGallery();
  function setMode(m) {
    state.mode = m; try { localStorage.setItem('saree.mode', m); } catch {}
    document.body.classList.toggle('feed-mode', m === 'feed');
    $('#modeToggle').textContent = m === 'feed' ? 'Grid' : 'Feed';
    $('#modeToggle').setAttribute('aria-label', m === 'feed' ? 'Switch to grid view' : 'Switch to feed view');
    if (m === 'grid') { $('#feed').innerHTML = ''; feedIO.disconnect(); }
    render();
  }
  $('#modeToggle').addEventListener('click', () => setMode(state.mode === 'feed' ? 'grid' : 'feed'));

  const FEED_BATCH = 12;
  const feedSrcset = u => /\/\/cdn\.shopify\.com\//.test(u) ? [720, 1080, 1440].map(w => `${sized(u, w)} ${w}w`).join(', ') : '';
  const photoHTML = (u, eager) => `<img src="${esc(sized(u, 1080))}" srcset="${esc(feedSrcset(u))}" sizes="100vw" alt=""
      ${eager ? '' : 'loading="lazy"'} decoding="async" draggable="false">`;
  function renderFeed() {
    const list = filtered().filter(it => !state.hidden.has(it.id));
    $('#count').textContent = list.length ? `${list.length} sarees` : '';
    feedIO.disconnect();
    const f = $('#feed'); f.innerHTML = ''; f.scrollTop = 0;
    state.flist = list; state.fshown = 0;
    if (!list.length) {
      f.innerHTML = `<div class="feed-end"><div>${state.savedOnly ? 'Nothing saved yet. Tap ♥ or double-tap a photo to save.' : 'Nothing matches those filters.'}</div>${hiddenNote()}</div>`;
      return;
    }
    appendFeed();
  }
  const hiddenNote = () => state.hidden.size ? `<div><button data-unhide>Bring back ${state.hidden.size} hidden</button></div>` : '';
  function slideHTML(it) {
    const saved = state.saved.has(it.id);
    return `<section class="slide" data-sid="${esc(it.id)}">
        <div class="strip-x">${photoHTML(it.img, state.fshown < 2)}</div>
        <div class="dots"></div><div class="pos" hidden></div>
        <div class="shade"></div><div class="burst" aria-hidden="true">♥</div>
        <div class="meta">
          <div class="b">${esc(brandName(it.brand))}</div>
          <button class="t" data-info>${esc(it.title)}</button>
          <div class="p"><span>${fmtPrice(it)}${it.available ? '' : ' · sold out'}</span>${it.fabric.map(x => `<span class="f">${esc(x)}</span>`).join('')}</div>
          <div class="d"></div>
          <a href="${esc(it.url)}" target="_blank" rel="noopener">Open on ${esc(brandName(it.brand))}</a>
        </div>
        <div class="rail">
          <button data-save aria-pressed="${saved}" aria-label="Save"><span class="ico">♥</span>${saved ? 'Saved' : 'Save'}</button>
          <button data-hide aria-label="Hide this saree"><span class="ico">✕</span>Hide</button>
          <button data-info aria-label="Details and similar"><span class="ico">i</span>More</button>
        </div>
      </section>`;
  }
  function appendFeed() {
    const f = $('#feed'), next = state.flist.slice(state.fshown, state.fshown + FEED_BATCH);
    f.querySelector('.feed-end')?.remove();
    const html = next.map(it => { const h = slideHTML(it); state.fshown++; return h; }).join('');
    f.insertAdjacentHTML('beforeend', html);
    if (state.fshown >= state.flist.length)
      f.insertAdjacentHTML('beforeend', `<div class="feed-end"><div>That's all ${state.flist.length}.</div>${hiddenNote()}</div>`);
    f.querySelectorAll('.slide:not([data-watched])').forEach(el => { el.dataset.watched = 1; feedIO.observe(el); });
  }
  // Load the next batch as you near the end, and fill in each saree's photos when it comes on screen.
  const feedIO = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    hydrate(e.target);
    const slides = $('#feed').querySelectorAll('.slide');
    if (e.target === slides[slides.length - 3] || slides.length < 3) appendFeed();
  }), { root: document.getElementById('feed'), rootMargin: '100% 0px' });

  // All photos of one saree, swiping sideways and looping: a copy of the last photo sits before the
  // first and a copy of the first after the last; landing on a copy jumps to the real one.
  function hydrate(slide) {
    const it = state.items.find(x => x.id === slide.dataset.sid); if (!it) return;
    const d = detail(it);
    if (d && d.description && !slide.querySelector('.d').textContent) slide.querySelector('.d').textContent = d.description;
    if (slide.dataset.hydrated === (d ? 'full' : 'min')) return;
    slide.dataset.hydrated = d ? 'full' : 'min';
    const imgs = d && d.images && d.images.length ? d.images : [it.img];
    const strip = slide.querySelector('.strip-x');
    const n = imgs.length;
    if (n < 2) { slide.querySelector('.dots').innerHTML = ''; slide.querySelector('.pos').hidden = true; return; }
    strip.innerHTML = [imgs[n - 1], ...imgs, imgs[0]].map(u => photoHTML(u, false)).join('');
    slide.querySelector('.dots').innerHTML = n <= 10 ? imgs.map(() => '<i></i>').join('') : '';
    slide.querySelector('.pos').hidden = n <= 10;
    const w = () => strip.clientWidth || 1;
    strip.scrollTo({ left: w(), behavior: 'instant' });
    const mark = () => {
      const i = Math.round(strip.scrollLeft / w());          // 0 and n+1 are the copies
      const real = i === 0 ? n : i === n + 1 ? 1 : i;
      slide.querySelectorAll('.dots i').forEach((dot, k) => dot.classList.toggle('on', k === real - 1));
      slide.querySelector('.pos').textContent = `${real} / ${n}`;
      return { i, real };
    };
    let t;
    const settle = () => { const { i, real } = mark(); if (i !== real) strip.scrollTo({ left: real * w(), behavior: 'instant' }); };
    strip.addEventListener('scroll', () => { mark(); clearTimeout(t); t = setTimeout(settle, 120); }, { passive: true });
    if ('onscrollend' in strip) strip.addEventListener('scrollend', () => { clearTimeout(t); settle(); });
    mark();
  }
  function feedDetailsArrived() {
    if (state.mode !== 'feed') return;
    const f = $('#feed'), top = f.getBoundingClientRect().top, h = f.clientHeight;
    f.querySelectorAll('.slide').forEach(s => { const r = s.getBoundingClientRect(); if (r.bottom > top - h && r.top < top + 2 * h) hydrate(s); });
  }
  addEventListener('resize', () => document.querySelectorAll('.slide[data-hydrated] .strip-x').forEach(st => {
    const i = Math.round(st.scrollLeft / (st._w || st.clientWidth || 1)); st._w = st.clientWidth; st.scrollTo({ left: i * st.clientWidth, behavior: 'instant' });
  }));
  function syncFeedSave(id) {
    const b = document.querySelector(`.slide[data-sid="${CSS.escape(id)}"] [data-save]`); if (!b) return;
    const on = state.saved.has(id); b.setAttribute('aria-pressed', on); b.lastChild.textContent = on ? 'Saved' : 'Save';
  }
  let lastTap = 0;
  $('#feed').addEventListener('click', e => {
    if (e.target.closest('[data-unhide]')) { state.hidden.clear(); persist(); renderFeed(); return; }
    const slide = e.target.closest('.slide'); if (!slide) return;
    const id = slide.dataset.sid;
    if (e.target.closest('[data-save]')) { state.saved.has(id) ? state.saved.delete(id) : state.saved.add(id); persist(); syncFeedSave(id); return; }
    if (e.target.closest('[data-info]')) { openItem(id); return; }
    if (e.target.closest('[data-hide]')) {
      state.hidden.add(id); persist();
      const next = slide.nextElementSibling;
      slide.style.transition = 'opacity .25s'; slide.style.opacity = 0;
      setTimeout(() => { slide.remove(); state.flist = state.flist.filter(x => x.id !== id); state.fshown--;
        $('#count').textContent = `${state.flist.length} sarees`; if (next) hydrate(next); }, 250);
      return;
    }
    if (e.target.closest('a')) return;
    const now = Date.now();
    if (now - lastTap < 320) {
      state.saved.add(id); persist(); syncFeedSave(id);
      const b = slide.querySelector('.burst'); b.classList.remove('go'); void b.offsetWidth; b.classList.add('go');
    }
    lastTap = now;
  });

  // Tall phones (20:9 to 22:9) are much narrower than most product photos. Show the whole photo,
  // and only fill the screen when that would crop less than 12% of it.
  const fitPhoto = img => {
    if (!img.naturalWidth) return;
    const box = img.clientWidth / (img.clientHeight || 1), pic = img.naturalWidth / img.naturalHeight;
    img.classList.toggle('fill', Math.min(box, pic) / Math.max(box, pic) > 0.88);
  };
  $('#feed').addEventListener('load', e => { if (e.target.tagName === 'IMG') fitPhoto(e.target); }, true);
  addEventListener('resize', () => document.querySelectorAll('.strip-x img').forEach(fitPhoto));

  // Installable app: offline copy of the page and catalog.
  if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));

  // ---- infinite scroll
  new IntersectionObserver(es => { if (es.some(x => x.isIntersecting)) appendBatch(); }, { rootMargin: '1200px 0px' })
    .observe(document.getElementById('sentinel'));

  // ---- load: the small index first so the wall shows quickly, then details in the background.
  // no-cache = revalidate with the server, so an unchanged file comes back as a tiny "not modified".
  fetch('data/index.json', { cache: 'no-cache' }).then(r => r.json()).then(cat => {
    state.brands = cat.brands || [];
    state.items = shuffleSeeded((cat.items || []).filter(i => i.img));
    renderStrips(); setMode(state.mode);
    if (cat.generated_at) {
      const d = new Date(cat.generated_at);
      const skipped = state.brands.filter(b => !b.count).map(b => b.name);
      $('#foot').textContent = `Refreshed ${d.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' })}` +
        (skipped.length ? ` · not reachable: ${skipped.join(', ')}` : '');
    }
    // versioned by refresh time, so the browser can keep it cached until the next refresh
    return fetch('data/details.json?v=' + encodeURIComponent(cat.generated_at || '')).then(r => r.json()).then(det => {
      state.details = det.items || {};
      state.items.forEach(it => { delete it._s; });   // search now includes tags
      if (state.q) render();
      feedDetailsArrived();
      if (state.open) { const top = $('#sheet').scrollTop; openItem(state.open); $('#sheet').scrollTop = top; }
      window.__ready = true;
    }).catch(() => {});                               // the gallery still works without details
  }).catch(() => { $('#empty').hidden = false; $('#empty').textContent = 'Could not load data/index.json.'; });
})();
</script>
</body>
</html>
